server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location /api/ { proxy_pass http://api:5000/api/; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $http_x_forwarded_for; proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; proxy_read_timeout 30s; }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|woff2)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
}
