# Optional local-only vulnerable target for authorized training.
# This is deliberately NOT included in the production deployment compose file.
services:
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    networks: [labnet]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /juice-shop/data:size=32m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
networks:
  labnet:
    internal: true
