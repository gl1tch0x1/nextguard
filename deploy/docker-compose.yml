services:
  api:
    build: ../server
    restart: unless-stopped
    env_file: ../server/.env
    environment:
      PORT: 5000
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN to the public HTTPS origin}
      TRUST_PROXY: "1"
    expose: ["5000"]
    networks: [appnet]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
  web:
    build:
      context: ../client
      args: { VITE_API_URL: /api }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    networks: [appnet]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
networks:
  appnet:
    driver: bridge
